[package]
name = "timeline-timer"
version = "0.1.1"
description = "A calm, dockable agenda timeline"
authors = ["Timeline Timer contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "timeline_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
